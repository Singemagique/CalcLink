ShortDescription: Connect TI graphing calculators to your PC to transfer programs, apps, OS upgrades and backups, and take screenshots.
Description: |-
  CalcLink is a modern Windows app for linking Texas Instruments graphing calculators
  (TI-83 Plus/TI-84 Plus family including the CE, TI-89/92/Voyage 200, TI-Nspire) to a PC
  over a DirectLink USB cable or a SilverLink cable. It replaces the TiLP front-end and uses
  the same tilibs protocol libraries. USB access needs a one-time driver setup; see the
  USB driver guide in the project repository.
